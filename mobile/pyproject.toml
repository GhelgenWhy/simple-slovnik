[project]
name = "slovnik-mobile"
version = "0.2.0"
description = "Slovník — personal Czech/English ↔ uk/ru vocabulary (mobile APK)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Slovník User" }
]
# Pinned: the release build must be reproducible (see docs/RELEASE_STATE.md).
dependencies = [
    "flet==0.86.5"
]

[dependency-groups]
dev = [
    "flet-cli==0.86.5",
    "flet-desktop==0.86.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.flet]
org = "cz.slovnik"
product = "Slovník"
company = "Slovník"
copyright = "Copyright (C) 2026 Slovník"
# versionCode / versionName of the APK (Android rejects same-code updates).
build_number = 2
build_version = "0.2.0"

[tool.flet.app]
path = "src"
