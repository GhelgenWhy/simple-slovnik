[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slovnik"
version = "0.1.0"
description = "Personal Czech ↔ Ukrainian/Russian vocabulary desktop app"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Slovník User"}]
license = {text = "MIT"}
dependencies = [
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-qt>=4.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]
# Mobile smoke/handler tests (mobile/tests) import main.py, which needs
# flet; without it they are skipped, with it they run as part of `pytest`.
mobile-tests = [
    "flet==0.86.5",
]
# Spellcheck uses a pure-Python fallback by default; pyhunspell is the
# native-accelerated backend and is only available where pre-built wheels
# exist (currently no Python 3.11 Windows wheel). On other platforms you can
# `pip install -e .[spellcheck-hunspell]` for the faster path.
spellcheck-hunspell = [
    "pyhunspell>=0.5.5",
]
spellcheck-pure = [
    # pure-Python; Levenshtein is optional, only speeds up suggestions
    "python-Levenshtein>=0.21",
]
# Sync server (server/app.py) — only needed on the machine acting as the
# sync broker; the desktop app and the APK do NOT need this extra.
sync-server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
slovnik = "slovnik.app:run"
slovnik-dbcheck = "slovnik.db_check:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# The mobile smoke/handler tests are part of the required run: they skip
# only when flet is absent (install with `pip install -e .[mobile-tests]`).
testpaths = ["tests", "mobile/tests"]
addopts = "-v --tb=short"